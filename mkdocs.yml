site_name: Gitleaks for Mere Mortals
site_description: A scanner that searches your git history for secrets you committed and then forgot. Finding keys in old commits, reading what it reports, tuning out the false alarms, and catching the next secret before it lands, with the ethics and the limits stated plainly.
